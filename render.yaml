services:
  - type: web
    name: estateval-backend
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt gunicorn"
    startCommand: "gunicorn app:app --workers 3 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
